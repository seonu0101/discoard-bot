name: Update leaderboard

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 사정으로 늦어질 수 있음)
  workflow_dispatch:         # Actions 탭에서 "Run workflow"로 직접 실행

permissions:
  contents: write            # message_id.txt 저장(커밋)용

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update Discord message
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py --once

      - name: Save message ID
        run: |
          git add message_id.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save Discord message ID"
          git push
